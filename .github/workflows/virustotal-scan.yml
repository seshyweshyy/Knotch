name: VirusTotal Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (e.g. v1.4.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset
        id: download
        run: |
          gh release download "${{ steps.tag.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --output release.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary
        id: extract
        run: |
          mkdir -p extracted
          if ditto -x -k release.zip extracted 2>/dev/null || unzip -q release.zip -d extracted; then
            BINARY_PATH=$(find extracted -type f -path "*.app/Contents/MacOS/*" | head -n 1)
            if [ -n "$BINARY_PATH" ] && [ -f "$BINARY_PATH" ]; then
              echo "scan_target=$BINARY_PATH" >> "$GITHUB_OUTPUT"
              echo "scan_type=binary" >> "$GITHUB_OUTPUT"
              echo "Found binary at $BINARY_PATH"
            else
              echo "scan_target=release.zip" >> "$GITHUB_OUTPUT"
              echo "scan_type=zip" >> "$GITHUB_OUTPUT"
              echo "Binary not found inside .app bundle, falling back to zip"
            fi
          else
            echo "scan_target=release.zip" >> "$GITHUB_OUTPUT"
            echo "scan_type=zip" >> "$GITHUB_OUTPUT"
            echo "Extraction failed, falling back to zip"
          fi

      - name: Upload to VirusTotal
        id: upload
        run: |
          RESPONSE=$(curl -s -X POST "https://www.virustotal.com/api/v3/files" \
            -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
            -F "file=@${{ steps.extract.outputs.scan_target }}")
          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          if [ "$ANALYSIS_ID" = "null" ] || [ -z "$ANALYSIS_ID" ]; then
            echo "VirusTotal upload failed: $RESPONSE" >&2
            exit 1
          fi
          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Poll for analysis result
        id: result
        run: |
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s "https://www.virustotal.com/api/v3/analyses/${{ steps.upload.outputs.analysis_id }}" \
              -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}")
            STATUS=$(echo "$RESPONSE" | jq -r '.data.attributes.status')
            if [ "$STATUS" = "completed" ]; then
              MALICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.malicious')
              SUSPICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.stats.suspicious')
              TOTAL=$(echo "$RESPONSE" | jq -r '[.data.attributes.stats[]] | add')
              FILE_ID=$(echo "$RESPONSE" | jq -r '.meta.file_info.sha256')
              echo "detections=$((MALICIOUS + SUSPICIOUS))" >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
              echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "VirusTotal analysis did not complete in time" >&2
          exit 1

      - name: Update README
        run: |
          python3 .github/scripts/update_virustotal_readme.py \
            --tag "${{ steps.tag.outputs.tag_name }}" \
            --detections "${{ steps.result.outputs.detections }}" \
            --total "${{ steps.result.outputs.total }}" \
            --file-id "${{ steps.result.outputs.file_id }}" \
            --scan-type "${{ steps.extract.outputs.scan_type }}"

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update VirusTotal scan results for ${{ steps.tag.outputs.tag_name }}"
          git push
