name: VirusTotal Scan

concurrency:
  group: push-to-main
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (e.g. v1.4.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset
        id: download
        run: |
          gh release download "${{ steps.tag.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --output release.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary
        id: extract
        run: |
          mkdir -p extracted
          if ditto -x -k release.zip extracted 2>/dev/null || unzip -q release.zip -d extracted; then
            APP_PATH=$(find extracted -maxdepth 2 -type d -name "*.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              PLIST_PATH="$APP_PATH/Contents/Info.plist"
              EXEC_NAME=$(python3 -c "import plistlib, sys; f=open('$PLIST_PATH','rb'); data=plistlib.load(f); f.close(); print(data.get('CFBundleExecutable',''))" 2>/dev/null)
              if [ -n "$EXEC_NAME" ]; then
                BINARY_PATH="$APP_PATH/Contents/MacOS/$EXEC_NAME"
              fi
            fi
            if [ -n "$BINARY_PATH" ] && [ -f "$BINARY_PATH" ]; then
              echo "scan_target=$BINARY_PATH" >> "$GITHUB_OUTPUT"
              echo "scan_type=binary" >> "$GITHUB_OUTPUT"
              echo "Found binary at $BINARY_PATH"
            else
              echo "scan_target=release.zip" >> "$GITHUB_OUTPUT"
              echo "scan_type=zip" >> "$GITHUB_OUTPUT"
              echo "Binary not found inside .app bundle, falling back to zip"
            fi
          else
            echo "scan_target=release.zip" >> "$GITHUB_OUTPUT"
            echo "scan_type=zip" >> "$GITHUB_OUTPUT"
            echo "Extraction failed, falling back to zip"
          fi

      - name: Submit to VirusTotal
        id: upload
        run: |
          RESPONSE=$(curl -s -X POST "https://www.virustotal.com/api/v3/files" \
            -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
            -F "file=@${{ steps.extract.outputs.scan_target }}")
          ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error.code // empty')
          if [ -n "$ERROR_CODE" ] && [ "$ERROR_CODE" != "AlreadySubmittedError" ]; then
            echo "VirusTotal upload failed: $RESPONSE" >&2
            exit 1
          fi
          echo "Submission response: $RESPONSE"

      - name: Compute file hash
        id: hash
        run: |
          FILE_ID=$(sha256sum "${{ steps.extract.outputs.scan_target }}" | awk '{print $1}')
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"

      - name: Poll for analysis result
        id: result
        run: |
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s "https://www.virustotal.com/api/v3/files/${{ steps.hash.outputs.file_id }}" \
              -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}")
            TOTAL=$(echo "$RESPONSE" | jq -r '[.data.attributes.last_analysis_stats[]?] | add // 0')
            if [ "$TOTAL" -gt 0 ]; then
              MALICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.last_analysis_stats.malicious')
              SUSPICIOUS=$(echo "$RESPONSE" | jq -r '.data.attributes.last_analysis_stats.suspicious')
              echo "detections=$((MALICIOUS + SUSPICIOUS))" >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "VirusTotal analysis did not complete in time" >&2
          exit 1

      - name: Update README
        run: |
          python3 .github/scripts/update_virustotal_readme.py \
            --tag "${{ steps.tag.outputs.tag_name }}" \
            --detections "${{ steps.result.outputs.detections }}" \
            --total "${{ steps.result.outputs.total }}" \
            --file-id "${{ steps.hash.outputs.file_id }}" \
            --scan-type "${{ steps.extract.outputs.scan_type }}"

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update VirusTotal scan results for ${{ steps.tag.outputs.tag_name }}"

          for i in $(seq 1 5); do
            git fetch origin main
            git rebase origin/main && git push origin main && exit 0
            echo "Push rejected, retrying ($i/5)..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
