name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify for (e.g. v1.7.0)'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release data (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        id: fetch_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}")
          echo "tag_name=$(echo "$RELEASE_JSON" | jq -r .tag_name)" >> "$GITHUB_OUTPUT"
          echo "html_url=$(echo "$RELEASE_JSON" | jq -r .html_url)" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_JSON" | jq -r .body >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send and publish release notes to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ steps.fetch_release.outputs.tag_name }}"
            RELEASE_URL="${{ steps.fetch_release.outputs.html_url }}"
            RAW_BODY="${{ steps.fetch_release.outputs.body }}"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            RELEASE_URL="${{ github.event.release.html_url }}"
            RAW_BODY="${{ github.event.release.body }}"
          fi

          # Release notes use <img> tags to show section icons (rendered by GitHub and the
          # Sparkle update popup), but Discord's markdown doesn't parse raw HTML — it would
          # print the tags as literal text. Swap them back to the emoji headers used before
          # the icon change, which Discord renders natively.
          FORMATTED_BODY=$(echo "$RAW_BODY" | perl -pe '
            s{<img[^>]*/macbook\.svg[^>]*>}{💻}g;
            s{<img[^>]*/sparkles\.svg[^>]*>}{✨}g;
            s{<img[^>]*/wrench-fixes\.svg[^>]*>}{🔧}g;
          ')
          RELEASE_BODY=$(echo "$FORMATTED_BODY" | jq -Rs .)

          SEND_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"⬇ Knotch $RELEASE_TAG released!\",
                \"description\": $RELEASE_BODY,
                \"url\": \"$RELEASE_URL\",
                \"color\": 5814783
              }]
            }" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages")

          SEND_BODY=$(echo "$SEND_RESPONSE" | head -n -1)
          SEND_STATUS=$(echo "$SEND_RESPONSE" | tail -n 1)

          echo "Send status: $SEND_STATUS"
          echo "Send response: $SEND_BODY"

          if [ "$SEND_STATUS" -ge 400 ]; then
            echo "::error::Discord message send failed with status $SEND_STATUS"
            exit 1
          fi

          MESSAGE_ID=$(echo "$SEND_BODY" | jq -r .id)

          if [ "$MESSAGE_ID" = "null" ] || [ -z "$MESSAGE_ID" ]; then
            echo "::error::No message ID returned from Discord, cannot crosspost"
            exit 1
          fi

          CROSSPOST_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -X POST \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages/$MESSAGE_ID/crosspost")

          CROSSPOST_BODY=$(echo "$CROSSPOST_RESPONSE" | head -n -1)
          CROSSPOST_STATUS=$(echo "$CROSSPOST_RESPONSE" | tail -n 1)

          echo "Crosspost status: $CROSSPOST_STATUS"
          echo "Crosspost response: $CROSSPOST_BODY"

          if [ "$CROSSPOST_STATUS" -ge 400 ]; then
            echo "::error::Discord crosspost failed with status $CROSSPOST_STATUS"
            exit 1
          fi
