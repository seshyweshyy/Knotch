name: Post Bug Report Message

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send embed to #bug-discussions
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BUG_DISCUSSIONS_CHANNEL_ID: ${{ secrets.BUG_DISCUSSIONS_CHANNEL_ID }}
        run: |
          curl -s -w "\n%{http_code}" -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "🐛 Reporting a Bug?",
                "description": "Please submit bug reports directly on GitHub using our Bug Report template instead of posting here — it makes sure we get all the details we need (steps to reproduce, expected behavior, screenshots/videos) in a format that'\''s easy to track and follow up on.\n\n[Submit a Bug Report](https://github.com/seshyweshyy/Knotch/issues/new?template=1-bug-report-form.yml)\n\nFeel free to use this channel to discuss existing bugs, ask questions, or check if something'\''s already been reported!",
                "color": 5814783
              }]
            }' \
            "https://discord.com/api/v10/channels/$BUG_DISCUSSIONS_CHANNEL_ID/messages"
