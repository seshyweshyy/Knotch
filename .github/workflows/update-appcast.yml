name: Update Appcast

concurrency:
  group: push-to-main
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g. v1.1.0)'
        required: true

jobs:
  update-appcast:
    runs-on: macos-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.8.0"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o sparkle.tar.xz
          file sparkle.tar.xz
          tar -xf sparkle.tar.xz -C .
          mkdir -p sparkle_tools/bin
          cp bin/generate_appcast sparkle_tools/bin/
          echo "GENERATE_APPCAST=sparkle_tools/bin/generate_appcast" >> $GITHUB_ENV

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p updater/releases
          gh release download "${{ github.event.release.tag_name || inputs.tag }}" \
            --pattern "*.zip" \
            --dir updater/releases \
            --repo ${{ github.repository }}

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          brew install pandoc
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          ZIP=$(find updater/releases -maxdepth 1 -name "*.zip" | head -1)
          BASENAME="${ZIP%.zip}"
          gh release view "$TAG" --repo ${{ github.repository }} --json body -q .body | tr -d '\r' > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            # --wrap=none keeps each tag on one line so the heading-stripping sed below
            # (which only inspects line 1) can't cut a tag in half and leave stray text.
            pandoc -f gfm -t html --wrap=none /tmp/release-notes.md -o "$BASENAME.html"
            # Drop the redundant "# Knotch vX.Y.Z" heading and its divider — the version is already shown in the update dialog title.
            sed -i '' '1{/<h1/d;}' "$BASENAME.html"
            sed -i '' '1{/<hr/d;}' "$BASENAME.html"
          fi

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | \
            ${{ env.GENERATE_APPCAST }} \
              --ed-key-file - \
              --embed-release-notes \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name || inputs.tag }}/" \
              --link "https://github.com/${{ github.repository }}" \
              -o updater/appcast.xml \
              updater/releases

      - name: Commit and push appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/appcast.xml
          git diff --cached --quiet || git commit -m "chore: update appcast for ${{ github.event.release.tag_name || inputs.tag }}"
          success=false
          for i in 1 2 3 4 5; do
            git fetch origin main
            git stash --include-untracked
            if git rebase origin/main && git stash drop && git push origin main; then
              success=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            git stash drop 2>/dev/null || true
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$success" != "true" ]; then
            echo "All push attempts failed"
            exit 1
          fi
