name: Feature Request
description: Suggest a new idea or enhancement for Knotch
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        
        Thanks for helping make **Knotch** better! Please check [existing requests](https://github.com/seshyweshyy/Knotch/issues?q=is%3Aissue+label%3Aenhancement) before submitting to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A brief description of the problem or frustration this would solve. Leave blank if not applicable.
      placeholder: "e.g. I can't see my calendar when I'm in full-screen apps..."
    validations:
      required: false
      
  - type: textarea
    id: solution
    attributes:
      label: What would you like Knotch to do?
      description: Describe the feature and how it should work.
      placeholder: "e.g. Show my next calendar event in the notch with a countdown timer..."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context & screenshots
      description: |
        Add any other context, mockups, wireframes, or screenshots about the feature request here. Visuals are incredibly helpful!
        
        You can drag and drop images directly into this field.
      placeholder: "Here is a mockup of how the hover state should look..."
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: "We love community contributions! Would you be willing to help build this?"
      options:
        - label: "I'd like to help implement this"
        - label: "I can help with design or mockups"

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      description: "Please confirm the following before submitting:"
      options:
        - label: "I have searched existing issues to ensure this isn't a duplicate"
          required: true
